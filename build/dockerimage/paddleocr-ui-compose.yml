# PaddleOCR UI v0.2.0 — Docker Compose 部署
# 使用方法:
#   1. docker load -i paddleocr-ui-v0.2.0.tar
#   2. docker compose -f paddleocr-ui-compose.yml up -d
services:
  paddleocr-ui:
    image: paddleocr-ui:v0.2.0
    container_name: paddleocr-ui
    ports:
      - "8000:8000"
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - PADDLEOCR_SECRET=${PADDLEOCR_SECRET:-paddleocr-prod-secret}
      - PADDLE_PDX_MODEL_SOURCE=modelscope
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - PYTHONUNBUFFERED=1
      - FLAGS_enable_pir_api=False
      - OMP_WAIT_POLICY=passive
    volumes:
      - ./data/db:/app/app/data
      - ./data/uploads:/app/app/uploads
      - ./data/outputs:/app/app/data/outputs
    restart: unless-stopped